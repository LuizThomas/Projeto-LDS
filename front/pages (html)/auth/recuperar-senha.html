<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - IFCE Iventus</title>
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/auth/recuperar-senha.css">
</head>
<body>
  <div class="auth-container text-center">
    <h2>Recuperar senha</h2>
    
    <div class="icon-wrapper">
      <img src="../../assets/images/mail-icon.svg" alt="Ícone de Recuperação" class="recover-icon" onerror="this.remove()">
    </div>

    <p class="description">Digite seu e-mail para receber um link de recuperação de senha.</p>

    <form id="recoverForm">
      <div class="form-group text-left">
        <label for="email">E-mail</label>
        <input type="email" id="email" class="form-control" placeholder="seuemail@exemplo.com" required>
      </div>

      <button type="submit" class="btn-primary">Enviar link de recuperação</button>

      <div class="auth-links text-center">
        <a href="login.html">Voltar para o login</a>
      </div>
    </form>
  </div>

  <script src="../../js/pages/auth/recuperar-senha.js"></script>
</body>
</html>
