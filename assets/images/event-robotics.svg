<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <rect width="400" height="200" fill="#451A03" />
  <circle cx="80" cy="140" r="100" fill="#D97706" opacity="0.2" />
  <!-- Robot head / automation graphic -->
  <g transform="translate(180, 40)">
    <rect x="0" y="20" width="80" height="70" rx="14" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
    <line x1="40" y1="20" x2="40" y2="4" stroke="#D97706" stroke-width="4" />
    <circle cx="40" cy="4" r="6" fill="#DC2626" />
    <!-- Eyes -->
    <rect x="15" y="40" width="18" height="12" rx="4" fill="#1E293B" />
    <circle cx="24" cy="46" r="3" fill="#38BDF8" />
    <rect x="47" y="40" width="18" height="12" rx="4" fill="#1E293B" />
    <circle cx="56" cy="46" r="3" fill="#38BDF8" />
    <!-- Mouth / Speaker -->
    <line x1="24" y1="68" x2="56" y2="68" stroke="#1E293B" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="40" y="90" font-family="sans-serif" font-size="22" font-weight="800" fill="#FBBF24">Robótica</text>
  <text x="40" y="115" font-family="sans-serif" font-size="13" fill="#FDE68A">Automação &amp; IoT</text>
</svg>
