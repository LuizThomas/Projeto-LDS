<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criação de Nova Senha - IFCE Iventus</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo-icon.svg" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body style="background-color: #F8FAFC;">

  <div class="auth-wrapper">
    <div class="auth-single-card">
      <div class="text-center" style="margin-bottom: 24px;">
        <div class="auth-logo-badge" style="margin: 0 auto 16px; background-color: var(--color-success);">🛡️</div>
        <h2 class="auth-title">Criação de nova senha</h2>
        <p class="auth-description">Defina sua nova credencial de segurança para reestabelecer o acesso</p>
      </div>

      <form onsubmit="event.preventDefault(); alert('Senha alterada com sucesso!'); window.location.href='login.html';">
        <div class="form-group">
          <label class="form-label form-label-required">Nova senha</label>
          <input type="password" class="form-control" name="new_password" placeholder="Mínimo 6 caracteres" required minlength="6" />
        </div>

        <div class="form-group">
          <label class="form-label form-label-required">Confirmar nova senha</label>
          <input type="password" class="form-control" name="confirm_password" placeholder="Repita a nova senha" required minlength="6" />
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" style="margin-top: 12px;">
          Salvar nova senha
        </button>
      </form>

      <div class="auth-footer-links">
        <a href="login.html">← Voltar ao login</a>
      </div>
    </div>
  </div>

</body>
</html>
